name: CI

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  ci:
    name: CI (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: Check syntax
        run: uv run python -m py_compile generate_landscape.py main.py

      - name: Lint (advisory)
        run: uv run --with ruff ruff check . --select E,F --ignore E501,E741 || true
        # || true: ruff is advisory until the baseline is clean
